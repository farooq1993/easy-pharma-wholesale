{% extends 'includes/base.html' %}

{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-person-badge"></i> {{ page_title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">MR Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ mr.name|default:'' }}" required placeholder="e.g. Rahul Sharma">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Company <span class="text-danger">*</span></label>
                        <select name="company" class="form-select" required>
                            <option value="">-- Select Company --</option>
                            {% for comp in companies %}
                                <option value="{{ comp.id }}" {% if mr.company_id == comp.id %}selected{% endif %}>{{ comp.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ mr.phone|default:'' }}" placeholder="Optional">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Monthly Target (₹)</label>
                            <input type="number" step="0.01" name="monthly_target" class="form-control" value="{{ mr.monthly_target|default_if_none:'' }}" placeholder="e.g. 500000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Commission (%)</label>
                            <input type="number" step="0.01" name="commission_percentage" class="form-control" value="{{ mr.commission_percentage|default_if_none:'' }}" placeholder="e.g. 2.5">
                        </div>
                    </div>

                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="status" id="statusSwitch" {% if mr is None or mr.status %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="statusSwitch">Active MR</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'mr_list' %}" class="btn btn-light px-4 rounded-pill">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill fw-semibold">Save MR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
