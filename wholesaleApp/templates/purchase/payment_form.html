{% extends 'includes/base.html' %}

{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-12">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="mb-0 text-dark fw-bold"><i class="bi bi-wallet2 text-primary me-2"></i>Record Supplier Payment</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <!-- Supplier -->
                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Select Supplier <span class="text-danger">*</span></label>
                            <select name="supplier" class="form-select rounded-3" required>
                                <option value="">-- Choose Supplier --</option>
                                {% for sup in suppliers %}
                                    <option value="{{ sup.id }}">
                                        {{ sup.name }} (Dues: ₹{{ sup.opening_balance|floatformat:2 }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Date -->
                        <div class="col-md-6 col-12">
                            <label class="form-label text-muted small fw-bold">Payment Date <span class="text-danger">*</span></label>
                            <input type="date" name="payment_date" class="form-control rounded-3" value="{% now 'Y-m-d' %}" required>
                        </div>

                        <!-- Amount -->
                        <div class="col-md-6 col-12">
                            <label class="form-label text-muted small fw-bold">Amount Paid (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="amount" class="form-control rounded-3" min="0.01" placeholder="0.00" required>
                        </div>

                        <!-- Payment Mode -->
                        <div class="col-md-6 col-12">
                            <label class="form-label text-muted small fw-bold">Payment Mode <span class="text-danger">*</span></label>
                            <select name="payment_mode" class="form-select rounded-3" required>
                                <option value="Cash">Cash</option>
                                <option value="Bank">Bank Transfer</option>
                                <option value="UPI">UPI</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>

                        <!-- Reference No -->
                        <div class="col-md-6 col-12">
                            <label class="form-label text-muted small fw-bold">Reference / Trans No.</label>
                            <input type="text" name="reference_no" class="form-control rounded-3" placeholder="e.g. UPI Transaction ID, Cheque No">
                        </div>

                        <!-- Remarks -->
                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Remarks / Notes</label>
                            <textarea name="remarks" class="form-control rounded-3" rows="3" placeholder="Add optional details..."></textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-12 border-top pt-3 mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-check-circle me-1"></i> Record Payment
                            </button>
                            <a href="{% url 'supplier_payment_list' %}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
