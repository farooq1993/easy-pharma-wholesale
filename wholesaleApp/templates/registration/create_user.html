<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Easy Pharma Wholesale</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #edd8fc 50%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 0;
        }

        /* Abstract Floating Accents */
        .shape-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            animation: floatShape 8s infinite alternate;
        }
        .shape-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            animation: floatShape 12s infinite alternate-reverse;
        }

        @keyframes floatShape {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        .register-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 15px 25px -10px rgba(0, 0, 0, 0.05);
            z-index: 10;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .register-header {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }
        .register-header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
        }

        .logo-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
            display: inline-block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 16px;
            border: 1.5px solid #e2e8f0;
            background-color: rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            background-color: #ffffff;
        }

        .btn-register {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>

    <div class="shape-1"></div>
    <div class="shape-2"></div>

    <div class="register-card p-0 shadow">
        <div class="register-header">
            <span class="logo-icon">🏢</span>
            <h3 class="fw-extrabold mb-1">Create Account</h3>
            <p class="text-white-50 mb-0 small">Register Wholesaler / Admin Account</p>
        </div>

        <div class="p-4 pt-2">
            <!-- Alert Messages -->
            {% if messages %}
                <div class="mb-3">
                    {% for msg in messages %}
                        <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show rounded-3 small py-2" role="alert">
                            {{ msg }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold"><i class="bi bi-shield-lock-fill"></i> User / Account Type <span class="text-danger">*</span></label>
                    <select name="account_type" class="form-select fw-semibold" required>
                        <option value="Owner" selected>Tenant Shop Owner (Default)</option>
                        <option value="Super Admin">SaaS Platform Admin</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-12">
                        <label class="form-label text-muted small fw-bold"><i class="bi bi-person-fill"></i> Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="Choose username..." required autofocus>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-bold"><i class="bi bi-envelope-fill"></i> Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-bold"><i class="bi bi-phone-fill"></i> Mobile Number</label>
                        <input type="text" name="mobile" class="form-control" placeholder="10-digit mobile">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold"><i class="bi bi-lock-fill"></i> Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Create strong password..." required>
                </div>

                <button type="submit" class="btn btn-primary btn-register w-100 text-white shadow-sm mb-3">
                    Create User Account
                </button>

                <div class="text-center">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="{% url 'login' %}" class="small text-decoration-none fw-bold" style="color: #6366f1;">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
